# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Coverage via covr. Uploads to Codecov when the CODECOV_TOKEN secret is set
# (required while the repo is private); without it the coverage numbers are
# still computed and printed, and the upload step is skipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Same r-universe rationale as testthat.yaml.
      - name: Add pharmaverse r-universe repository
        run: |
          cat(
            "options(repos = c(pharmaverse = 'https://pharmaverse.r-universe.dev', getOption('repos')))\n",
            file = file.path(path.expand("~"), ".Rprofile"),
            append = TRUE
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::covr
            any::admiral
            any::metacore
            any::metatools
            any::readxl
            any::pharmaversesdtm
            any::pharmaverseadam

      # package_coverage() exercises the INSTALLED package (helper.R dev-source
      # mode is off here), i.e. exactly the path R CMD check takes.
      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "coverage.xml")
        shell: Rscript {0}

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN_SET == 'true' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
