# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs the full testthat suite (including the heavy integration tests) on
# ubuntu-latest and windows-latest with R release.
#
# pilot1 note: test-integration.R resolves pilot1 fixture files under
# ../../../cdisc_data (a sibling of the repo that will NOT exist on CI) and
# calls skip() when file.exists() is FALSE, so those tests skip gracefully.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: testthat

jobs:
  testthat:
    name: testthat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # setup-r-dependencies@v2 has no `repos` input; pak resolves packages
      # against options(repos), so make the pharmaverse r-universe CRAN-like
      # repository visible. pharmaverseadam is only published there, and the
      # pharmaverse repo is listed first so the admiral 1.5.x builds (the API
      # this package's layer templates target) win over older CRAN releases.
      - name: Add pharmaverse r-universe repository
        run: |
          cat(
            "options(repos = c(pharmaverse = 'https://pharmaverse.r-universe.dev', getOption('repos')))\n",
            file = file.path(path.expand("~"), ".Rprofile"),
            append = TRUE
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::testthat
            any::haven
            any::dplyr
            any::rlang
            any::admiral
            any::metacore
            any::metatools
            any::readxl
            any::pharmaversesdtm
            any::pharmaverseadam

      - name: Run tests
        # helper.R only sources R/*.R when ADMIRALAGENT_DEV_SOURCE=1; this
        # workflow runs test_dir() against the source tree, so opt in here.
        env:
          ADMIRALAGENT_DEV_SOURCE: "1"
        run: Rscript -e "testthat::test_dir('tests/testthat', reporter='summary', stop_on_failure=TRUE)"
