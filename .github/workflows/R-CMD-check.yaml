# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# R CMD check on ubuntu-latest with R release.
#
# man/ does not exist yet (roxygen docs are generated in a later step), so
# R CMD check will emit missing-documentation warnings; error-on is set to
# "error" (instead of the default "warning") so the job stays green until
# documentation is added.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          artifact-name: check-results
