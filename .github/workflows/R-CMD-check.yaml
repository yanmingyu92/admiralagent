# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# R CMD check on ubuntu-latest with R release.
#
# man/ is generated by roxygen2 (44 Rd files, see RoxygenNote in DESCRIPTION),
# so documentation checks run for real. error-on is set to "error" (instead of
# the default "warning") so known non-fatal warnings do not fail the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          artifact-name: check-results
